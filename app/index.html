<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>JobMech</title>
<link rel="icon" href="assets/icon-256.png">
<script>
  // apply the saved theme before first paint (the real settings load a moment later)
  try {
    var t = localStorage.getItem('jm-theme') || 'system';
    var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/doc.css">
<style id="print-page">@page { margin: 0; }</style>
</head>
<body>
<div id="app" class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div id="view" class="view"></div></main>
</div>
<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90">
  <div style="text-align:center">
    <img src="assets/icon-256.png" width="56" height="56" alt="">
    <div id="boot-msg" class="muted" style="margin-top:14px;font-size:12.5px">Starting JobMech</div>
  </div>
</div>
<div id="stage"></div>
<div id="print-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
